name: Scan ourselves for ghosts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ghosts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Look for quiet failures in our own history
        run: python -m ghosts https://github.com/${{ github.repository }}
